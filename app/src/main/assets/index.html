<style>
/* 1rem = 1/96 of screen width, so the layout scales to any TV resolution */
html{font-size:calc(100vw / 96)}
:root{
  --bg:#0a1311; --bg2:#101d1a; --panel:#14241f; --panel2:#1b2f29; --line:#24403a;
  --toxic:#7dff3c; --toxic2:#4fd11a; --glow:rgba(125,255,60,.45);
  --red:#e3262e; --fire:#ff7a1a; --ember:#ffb347;
  --text:#eef5f1; --muted:#9db3aa; --dim:#62796f;
  --rail:7rem;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Rubik,"DejaVu Sans",system-ui,sans-serif;cursor:default}
button,input{font:inherit;color:inherit}
.bungee{font-family:Bungee,Impact,"DejaVu Sans",sans-serif}
.tag{font-family:"Special Elite","Courier New",monospace;color:var(--toxic)}
.f{outline:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.35;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 4px)}

/* ===== side rail ===== */
#rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:40;display:flex;flex-direction:column;align-items:stretch;padding:2.2rem 1rem;gap:.6rem;
  background:linear-gradient(90deg,rgba(6,12,10,.98),rgba(6,12,10,.9));border-right:.1rem solid var(--line);transition:width .18s ease}
#rail:focus-within{width:24rem;box-shadow:2rem 0 4rem rgba(0,0,0,.6)}
#rail .logo{display:flex;align-items:center;gap:1rem;margin-bottom:2.2rem;height:4.4rem;overflow:hidden}
#rail .logo img{width:5rem;height:3.5rem;object-fit:cover;border-radius:.6rem;box-shadow:0 0 1.2rem var(--glow);flex:0 0 auto}
#rail .logo .nm{white-space:nowrap;opacity:0;transition:opacity .15s;line-height:1.05}
#rail .logo .nm b{display:block;font-family:Bungee,Impact,sans-serif;font-size:1.6rem;color:var(--toxic);text-shadow:0 0 1rem var(--glow);font-weight:400}
#rail .logo .nm i{font-style:normal;font-family:Bungee,Impact,sans-serif;font-size:1.6rem;color:#fff}
#rail:focus-within .logo .nm{opacity:1}
#rail button{display:flex;align-items:center;gap:1.4rem;background:none;border:0;border-radius:1rem;padding:1rem 1.15rem;color:var(--muted);white-space:nowrap;overflow:hidden;font-size:1.45rem;cursor:pointer}
#rail button svg{width:2.4rem;height:2.4rem;flex:0 0 auto}
#rail button span{opacity:0;transition:opacity .15s}
#rail:focus-within button span{opacity:1}
#rail button.cur{color:var(--toxic)}
#rail button.cur svg{filter:drop-shadow(0 0 .5rem var(--glow))}
#rail button:focus{background:var(--toxic);color:#071006}
#rail button:focus svg{filter:none}
#rail .sp{flex:1}
#rail .clock{color:var(--dim);font-size:1.2rem;text-align:center;white-space:nowrap}

/* ===== views ===== */
.view{position:fixed;left:var(--rail);right:0;top:0;bottom:0;display:none;overflow:hidden}
.view.on{display:block}
.scrollv{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:3rem 0 6rem}
.scrollv::-webkit-scrollbar{display:none}
.vpad{padding:0 4rem}
h1.vt{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:3rem;margin:0 0 .6rem}
p.vs{color:var(--muted);font-size:1.4rem;margin:0 0 2.4rem}

/* ===== home ===== */
#homeBg{position:absolute;inset:0;background:#000 center/cover no-repeat;transition:background-image .3s}
#homeBg::after{content:"";position:absolute;inset:0;background:

#homeInfo{position:absolute;left:4rem;top:4rem;width:48rem;height:20rem}
#homeInfo .k{font-size:1.5rem;margin-bottom:1rem}
#homeInfo h2{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:3.6rem;line-height:1.05;margin:0 0 1rem;text-shadow:0 .3rem 1.4rem rgba(0,0,0,.8)}
#homeInfo img.lg{max-width:34rem;max-height:9rem;display:block;margin-bottom:1rem}
#homeInfo .d{font-size:1.45rem;line-height:1.5;color:#d3e2db;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:1rem}
.mline{display:flex;gap:1rem;align-items:center;font-size:1.35rem;color:#dbe8e2;flex-wrap:wrap}
.imdb{background:#f5c518;color:#000;font-weight:700;border-radius:.4rem;padding:.1rem .6rem}
.chip{font-size:1.1rem;padding:.3rem .8rem;border-radius:99rem;background:rgba(255,255,255,.06);border:.1rem solid var(--line);color:#c2d6cd;text-transform:uppercase;letter-spacing:.06em}
.chip.g{color:var(--toxic);border-color:rgba(125,255,60,.4)}
.chip.o{color:var(--ember);border-color:rgba(255,122,26,.4)}
#homeRows{position:absolute;left:0;right:0;top:26.5rem;bottom:0;overflow:hidden}
#homeRowsIn{transition:transform .25s ease}

/* rows & cards */
.row{margin-bottom:2.4rem}
.row h3{margin:0 4rem 1rem;font-size:1.7rem;font-weight:700;display:flex;align-items:center;gap:1rem}
.row h3::before{content:"";width:.45rem;height:1.8rem;border-radius:.3rem;background:var(--toxic);box-shadow:0 0 .8rem var(--glow)}
.row h3 small{font-size:1.05rem;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-weight:500}
.scroller{display:flex;gap:1.6rem;overflow:hidden;padding:1.2rem 4rem 1.4rem;scroll-behavior:smooth}
.card{flex:0 0 auto;width:13rem;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.card .pst{width:100%;aspect-ratio:2/3;border-radius:1rem;background:var(--panel) center/cover no-repeat;border:.15rem solid var(--line);position:relative;overflow:hidden;
  display:grid;place-items:center;transition:transform .15s ease,box-shadow .15s ease}
.card .ph{font-family:Bungee,Impact,sans-serif;font-size:1.2rem;color:var(--dim);padding:1rem;text-align:center}
.card .nm{font-size:1.25rem;margin-top:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s}
.card:focus .pst{transform:scale(1.09);box-shadow:0 0 0 .3rem var(--toxic),0 0 2.4rem var(--glow),0 1.4rem 3rem rgba(0,0,0,.6);border-color:transparent;z-index:2}
.card:focus .nm{color:var(--text)}
.card .prog{position:absolute;left:0;right:0;bottom:0;height:.5rem;background:rgba(0,0,0,.6)}
.card .prog i{display:block;height:100%;background:var(--toxic)}
.card.wide{width:24rem}.card.wide .pst{aspect-ratio:16/9}
.card.more .pst{background:linear-gradient(135deg,var(--panel2),var(--panel));color:var(--toxic);font-family:Bungee,Impact,sans-serif;font-size:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,13rem);gap:2.4rem 1.8rem;padding:1rem 4rem}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.9rem;border:.15rem solid var(--line);border-radius:1rem;padding:1.05rem 1.8rem;background:rgba(20,36,31,.85);color:var(--text);font-size:1.4rem;font-weight:700;cursor:pointer;transition:transform .12s}
.btn svg{width:1.8rem;height:1.8rem}
.btn.primary{border-color:rgba(125,255,60,.5);color:var(--toxic)}
.btn:focus{background:var(--toxic);color:#071006;border-color:var(--toxic);box-shadow:0 0 2rem var(--glow);transform:scale(1.05)}
.btn.danger:focus{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 2rem rgba(227,38,46,.5)}
.btn.on{border-color:rgba(255,122,26,.6);color:var(--ember)}
.btn.sm{padding:.7rem 1.2rem;font-size:1.2rem}
.actions{display:flex;gap:1.2rem;flex-wrap:wrap;margin:2rem 0}

/* inputs */
.field{display:flex;gap:1rem;align-items:center;max-width:70rem;margin-bottom:2rem}
.field input{flex:1;background:var(--panel);border:.2rem solid var(--line);border-radius:1rem;padding:1.2rem 1.6rem;font-size:1.6rem;outline:none;min-width:0}
.field input:focus{border-color:var(--toxic);box-shadow:0 0 1.6rem var(--glow)}

/* ===== detail ===== */
#detBg{position:absolute;inset:0;background:#000 center/cover no-repeat}
#detBg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 8%,rgba(10,19,17,.82) 45%,rgba(10,19,17,.25)),linear-gradient(0deg,var(--bg) 5%,transparent 50%)}
#detBody{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:6rem 0 6rem}
#detBody::-webkit-scrollbar{display:none}
#detBody .info{padding:0 4rem;max-width:62rem}
#detBody h1{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:4rem;line-height:1.05;margin:0 0 1.2rem;text-shadow:0 .3rem 1.4rem rgba(0,0,0,.8)}
#detBody img.lg{max-width:40rem;max-height:11rem;display:block;margin-bottom:1.4rem}
#detBody .d{font-size:1.5rem;line-height:1.55;color:#d3e2db;margin:1.4rem 0 0}
#detBody .cast{font-size:1.25rem;color:var(--muted);margin-top:1rem}
.seasons{display:flex;gap:1rem;padding:.6rem 4rem 0;flex-wrap:wrap}
.seasons .btn{padding:.7rem 1.4rem;font-size:1.25rem}
.seasons .btn.cur{border-color:var(--toxic);color:var(--toxic)}
.seasons .btn.cur:focus{color:#071006}
.ep{flex:0 0 auto;width:26rem;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.ep .th{aspect-ratio:16/9;border-radius:1rem;background:var(--panel2) center/cover;border:.15rem solid var(--line);position:relative;transition:transform .15s,box-shadow .15s;overflow:hidden}
.ep .th .no{position:absolute;left:.8rem;top:.8rem;background:rgba(0,0,0,.75);border-radius:.5rem;padding:.2rem .7rem;font-size:1.1rem;font-weight:700;color:var(--toxic)}
.ep .t{font-size:1.35rem;font-weight:700;margin-top:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .o{font-size:1.15rem;color:var(--muted);margin-top:.3rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep:focus .th{transform:scale(1.06);box-shadow:0 0 0 .3rem var(--toxic),0 0 2.4rem var(--glow);border-color:transparent}
.ep .prog{position:absolute;left:0;right:0;bottom:0;height:.45rem;background:rgba(0,0,0,.6)}.ep .prog i{display:block;height:100%;background:var(--toxic)}

/* ===== side panel (streams) ===== */
#panel{position:fixed;top:0;right:0;bottom:0;width:46rem;z-index:60;background:rgba(9,17,15,.97);border-left:.15rem solid var(--line);
  box-shadow:-3rem 0 6rem rgba(0,0,0,.7);transform:translateX(105%);transition:transform .2s ease;display:flex;flex-direction:column;padding:3rem 2.6rem}
#panel.on{transform:none}
#panel h2{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:2rem;margin:0 0 .4rem}
#panel .sub{color:var(--muted);font-size:1.2rem;margin-bottom:1.4rem}
#panel .filters{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:1.4rem}
#panel .list{flex:1;overflow:hidden;position:relative}
#panel .listIn{transition:transform .15s}
.stream{display:block;width:100%;text-align:left;background:var(--panel);border:.15rem solid var(--line);border-radius:1rem;padding:1.2rem 1.4rem;margin-bottom:1rem;cursor:pointer}
.stream .sn{font-weight:700;font-size:1.35rem;color:var(--toxic);white-space:pre-line}
.stream .st{font-size:1.2rem;color:#d0e0d8;white-space:pre-line;margin-top:.4rem;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stream .sa{font-size:1rem;color:var(--dim);margin-top:.6rem;text-transform:uppercase;letter-spacing:.08em}
.stream:focus{border-color:var(--toxic);box-shadow:0 0 0 .15rem var(--toxic),0 0 2rem var(--glow);background:var(--panel2)}
.stream.na{opacity:.55}
.loader{display:flex;align-items:center;gap:1rem;color:var(--muted);font-size:1.3rem;padding:1.2rem 0}
.spin{width:2rem;height:2rem;border-radius:50%;border:.25rem solid var(--line);border-top-color:var(--toxic);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== addons ===== */
.addon{display:flex;gap:1.6rem;align-items:center;background:rgba(20,36,31,.8);border:.15rem solid var(--line);border-radius:1.2rem;padding:1.4rem 1.6rem;margin-bottom:1.2rem;max-width:90rem}
.addon .lg{width:6rem;height:6rem;border-radius:1rem;background:var(--panel2) center/cover;flex:0 0 auto;display:grid;place-items:center;font-family:Bungee,Impact,sans-serif;font-size:2rem;color:var(--toxic);border:.15rem solid var(--line)}
.addon .bd{flex:1;min-width:0}
.addon .nm{font-size:1.6rem;font-weight:700}
.addon .nm small{font-size:1.1rem;color:var(--dim);font-weight:500;margin-left:.6rem}
.addon .ds{font-size:1.2rem;color:var(--muted);margin:.4rem 0 .8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addon .chips{display:flex;gap:.6rem;flex-wrap:wrap}
.addon .ab{display:flex;gap:.8rem;flex:0 0 auto}
.addon.off{opacity:.55}
.secth{font-size:1.7rem;font-weight:700;margin:3rem 0 1.2rem;display:flex;align-items:center;gap:1rem}
.note{font-size:1.2rem;color:var(--muted);max-width:80rem;line-height:1.5}

/* ===== player ===== */
#player{position:fixed;inset:0;z-index:80;background:#000;display:none}
#player.on{display:block}
#player video{position:absolute;inset:0;width:100%;height:100%;background:#000}
#osd{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .25s;
  background:linear-gradient(180deg,rgba(0,0,0,.8),transparent 22%,transparent 60%,rgba(0,0,0,.9))}
#osd.hide{opacity:0}
#osd .top{padding:3rem 4rem;display:flex;align-items:center;gap:1.6rem}
#osd .top img{height:4rem;border-radius:.5rem}
#osd .top .t{font-size:2rem;font-weight:700}
#osd .top .s{font-size:1.3rem;color:var(--muted)}
#osd .bot{padding:0 4rem 3.4rem}
.bar{position:relative;height:.7rem;border-radius:1rem;background:rgba(255,255,255,.18);margin:1rem 0 .8rem}
.bar .buf{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.25);border-radius:1rem}
.bar .pos{position:absolute;left:0;top:0;bottom:0;background:var(--toxic);border-radius:1rem;box-shadow:0 0 1rem var(--glow)}
.bar .knob{position:absolute;top:50%;width:1.8rem;height:1.8rem;margin:-.9rem 0 0 -.9rem;border-radius:50%;background:#fff;box-shadow:0 0 1rem var(--glow)}
.times{display:flex;justify-content:space-between;font-size:1.3rem;color:#d4e3dc;font-variant-numeric:tabular-nums}
.pbtns{display:flex;gap:1.2rem;margin-top:1.6rem;align-items:center}
.pbtns .sp{flex:1}
#pMsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;max-width:60rem;font-size:1.5rem;line-height:1.5}
#pMsg .spin{margin:0 auto;width:4.4rem;height:4.4rem;border-width:.4rem}
#seekHint{position:absolute;top:45%;font-family:Bungee,Impact,sans-serif;font-size:2.6rem;color:var(--toxic);text-shadow:0 0 1.4rem var(--glow);opacity:0;transition:opacity .2s}
#seekHint.on{opacity:1}

/* modal & toast */
#modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
#modal.on{display:flex}
#modal .box{background:var(--bg2);border:.15rem solid var(--line);border-radius:1.6rem;padding:3rem 3.4rem;min-width:44rem;max-width:64rem;box-shadow:0 0 4rem rgba(0,0,0,.7)}
#modal h2{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:2rem;margin:0 0 .8rem}
#modal p{color:var(--muted);font-size:1.35rem;margin:0}
#toast{position:fixed;right:3rem;top:3rem;z-index:100;background:var(--panel2);border:.15rem solid var(--toxic2);border-radius:1rem;padding:1.2rem 1.8rem;font-size:1.35rem;
  opacity:0;transform:translateY(-1rem);transition:.2s;box-shadow:0 0 2rem var(--glow);max-width:50rem}
#toast.on{opacity:1;transform:none}
#toast.err{border-color:var(--red);box-shadow:0 0 2rem rgba(227,38,46,.4)}
.empty{text-align:center;padding:6rem 2rem;color:var(--muted);font-size:1.4rem}
.empty img{width:30rem;border-radius:1.6rem;box-shadow:0 0 3rem var(--glow);margin-bottom:2rem}
.empty h2{font-family:Bungee,Impact,sans-serif;font-weight:400;color:var(--text);font-size:2.4rem;margin:0 0 .8rem}
</style>
</head>

        <button class="btn f" id="pPlay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg><span>Play</span></button>
        <button class="btn f" id="pBack10">−10s</button>
        <button class="btn f" id="pFwd30">+30s</button>
        <button class="btn f" id="pSubs">Subtitles: off</button>
        <div class="sp"></div>

      </div>

</div>

<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ================= storage ================= */
const LS = {
  get(k,d){ try{ const v=localStorage.getItem("fvod:"+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem("fvod:"+k, JSON.stringify(v)); }catch(e){} }
};
let addons = LS.get("addons", []);
let library = LS.get("library", {});
let progress = LS.get("progress", {});
let settings = LS.get("settings", {player:"builtin"});
const saveAddons=()=>LS.set("addons",addons), saveLib=()=>LS.set("library",library), saveProg=()=>LS.set("progress",progress), saveSettings=()=>LS.set("settings",settings);
const NATIVE = !!(window.Android && window.Android.openExternal);
const SUGGESTED = [
  {name:"AIOStreams", desc:"All your stream sources in one list, works with TorBox. Set it up on your phone, then paste your link here.", setup:"https://aiostreams.elfhosted.com/stremio/configure", match:/aiostreams/i},
  {name:"Cinemeta", desc:"Official Stremio metadata — popular movies & series, plus search.", url:"https://v3-cinemeta.strem.io/manifest.json"},
  {name:"OpenSubtitles v3", desc:"Official subtitles addon.", url:"https://opensubtitles-v3.strem.io/manifest.json"}
];

/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cssUrl=u=>u?`url("${String(u).replace(/["\\\n]/g,"")}")`:"none";
function toast(msg,err){ const t=$("#toast"); t.textContent=msg; t.className="on"+(err?" err":""); clearTimeout(t._h); t._h=setTimeout(()=>t.className="",3000); }
function normUrl(u){ u=(u||"").trim(); if(!u) return ""; u=u.replace(/^stremio:\/\//i,"https://"); if(!/^https?:\/\//i.test(u)) u="https://"+u;
  if(!/manifest\.json(\?.*)?$/i.test(u)) u=u.replace(/\/+$/,"")+"/manifest.json"; return u; }
const baseOf=url=>url.replace(/\/manifest\.json(\?.*)?$/i,"");
const cache=new Map();
function getJSON(url,{timeout=15000,nocache=false}={}){
  if(!nocache && cache.has(url)) return cache.get(url);
  const p=(async()=>{ const c=new AbortController(); const h=setTimeout(()=>c.abort(),timeout);
    try{ const r=await fetch(url,{signal:c.signal}); if(!r.ok) throw new Error("HTTP "+r.status); return await r.json(); } finally{ clearTimeout(h); } })();
  cache.set(url,p); p.catch(()=>cache.delete(url)); return p;
}
const fmt=s=>{ s=Math.max(0,Math.floor(s||0)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60; return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0"); };
setInterval(()=>{ $("#clock").textContent=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); },10000);
$("#clock").textContent=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});

/* ================= addon protocol ================= */
const enabled=()=>addons.filter(a=>a.enabled!==false);
function supports(a,resource,type,id){
  const m=a.manifest; if(!m||!Array.isArray(m.resources)) return false;
  for(const r of m.resources){
    const name=typeof r==="string"?r:r&&r.name; if(name!==resource) continue;
    const types=(typeof r==="object"&&r.types)||m.types||[];
    const pre=(typeof r==="object"&&r.idPrefixes)||m.idPrefixes;
    if(type&&types.length&&!types.includes(type)) continue;
    if(id&&Array.isArray(pre)&&pre.length&&!pre.some(p=>String(id).startsWith(p))) continue;
    return true;
  } return false;
}
const catExtras=c=>Array.isArray(c.extra)?c.extra.map(e=>typeof e==="string"?{name:e}:e):(c.extraSupported||[]).map(n=>({name:n,isRequired:(c.extraRequired||[]).includes(n)}));
function catUrl(a,c,extra){ const ex=extra&&Object.keys(extra).length?"/"+Object.entries(extra).map(([k,v])=>`${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join("&"):"";
  return `${baseOf(a.url)}/catalog/${encodeURIComponent(c.type)}/${encodeURIComponent(c.id)}${ex}.json`; }
async function installAddon(raw,quiet){
  const url=normUrl(raw); if(!url){ toast("Type or paste an addon link first",true); return false; }
  if(addons.some(a=>a.url===url)){ if(!quiet) toast("Already installed"); return false; }
  try{ const m=await getJSON(url,{nocache:true}); if(!m||!m.id||!m.name) throw new Error("not a valid addon");
    addons.push({url,manifest:m,enabled:true}); saveAddons(); toast("Installed "+m.name); return true;
  }catch(e){ toast("Couldn't load addon: "+(e.name==="AbortError"?"timed out":e.message),true); return false; }
}

/* ================= spatial navigation (D-pad) ================= */
const lastFocus = {};            // view -> element
const rowMemory = new WeakMap(); // scroller -> last focused child
function layer(){
  if($("#modal").classList.contains("on")) return $("#modal");
  if($("#player").classList.contains("on")) return $("#osd");
  if($("#panel").classList.contains("on")) return $("#panel");
  return null;
}
function candidates(){
  const L=layer();
  const roots = L ? [L] : [$("#rail"), $("#v-"+current)];
  const out=[]; roots.forEach(r=>r.querySelectorAll(".f").forEach(e=>{ if(!e.disabled && e.offsetParent!==null) out.push(e); }));
  return out;
}
function focusEl(el){
  if(!el) return;
  el.focus({preventScroll:true});
  revealEl(el);
}
function revealEl(el){
  const sc=el.closest(".scroller");
  if(sc){ rowMemory.set(sc,el); const pad=parseFloat(getComputedStyle(sc).paddingLeft)||0;
    const target=el.offsetLeft - sc.offsetLeft - pad; sc.scrollLeft = Math.max(0, target - (el.offsetWidth*0)); }
  if(current==="home" && el.closest("#homeRows")){
    const row=el.closest(".row"); const inner=$("#homeRowsIn");
    inner.style.transform=row?`translateY(${-row.offsetTop}px)`:"";
  } else if(el.closest("#panel .list")){
    const inner=$("#panel .listIn"), list=$("#panel .list");
    const top=el.offsetTop, h=list.clientHeight, cur=-(parseFloat((inner.style.transform.match(/-?[\d.]+/)||[0])[0])||0);
    let ny=cur; if(top-cur > h-el.offsetHeight-10) ny=top-h+el.offsetHeight+20; if(top<cur) ny=top-10;
    inner.style.transform=`translateY(${-Math.max(0,ny)}px)`;
  } else {
    const sv=el.closest(".scrollv,#detBody");
    if(sv){ const r=el.getBoundingClientRect(), s=sv.getBoundingClientRect();
      if(r.top < s.top+80) sv.scrollTop += r.top - s.top - 80;
      else if(r.bottom > s.bottom-80) sv.scrollTop += r.bottom - s.bottom + 80; }
  }
  if(!el.closest("#rail") && !layer()) lastFocus[current]=el;
  if(el.dataset.hover) heroFromCard(el);
}
function move(dir){
  const cur=document.activeElement;
  const list=candidates();
  if(!list.includes(cur)){ focusEl(defaultFocus()); return; }
  // leaving the rail to the right: go back to where we were
  if(dir==="right" && cur.closest("#rail") && !layer()){ const lf=lastFocus[current]; if(lf && document.contains(lf) && lf.offsetParent){ focusEl(lf); } else focusEl(firstContent()); return; }
  const inRail=!!cur.closest("#rail");
  const pool=list.filter(c=>{ const cr=!!c.closest("#rail"); return inRail ? (cr || dir==="right") : (!cr || dir==="left"); });
  const r=cur.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let best=null, bestScore=Infinity;
  for(const c of pool){
    if(c===cur) continue;
    const q=c.getBoundingClientRect(); const qx=q.left+q.width/2, qy=q.top+q.height/2;
    let main, cross;
    if(dir==="right"){ if(q.left < r.right-4 && qx<=cx+1) continue; if(qx<=cx) continue; main=Math.max(0,q.left-r.right); cross=Math.abs(qy-cy); }
    else if(dir==="left"){ if(qx>=cx) continue; if(q.right > r.left+4 && qx>=cx-1) continue; main=Math.max(0,r.left-q.right); cross=Math.abs(qy-cy); }
    else if(dir==="down"){ if(qy<=cy+2 || q.top < r.bottom-6) continue; main=Math.max(0,q.top-r.bottom); cross=Math.max(0, Math.abs(qx-cx) - (r.width/2)); }
    else { if(qy>=cy-2 || q.bottom > r.top+6) continue; main=Math.max(0,r.top-q.bottom); cross=Math.max(0, Math.abs(qx-cx) - (r.width/2)); }
    // keep horizontal moves within the same row, prefer near rows vertically
    const score = (dir==="left"||dir==="right") ? main + cross*4 : main*2 + cross;
    if(score<bestScore){ bestScore=score; best=c; }
  }
  if(!best) return;
  if(!inRail && best.closest("#rail")) best=$("#rail .cur")||best;
  // entering a horizontal row from above/below: return to that row's remembered item
  if((dir==="up"||dir==="down")){ const sc=best.closest(".scroller"); if(sc && sc!==cur.closest(".scroller")){ const m=rowMemory.get(sc); if(m && sc.contains(m)) best=m; } }
  focusEl(best);
}
function firstContent(){ const v=$("#v-"+current); return [...v.querySelectorAll(".f")].find(e=>e.offsetParent!==null) || $("#rail .cur"); }
function defaultFocus(){ const L=layer(); if(L) return [...L.querySelectorAll(".f")].find(e=>e.offsetParent!==null); const lf=lastFocus[current]; return (lf&&document.contains(lf)&&lf.offsetParent)?lf:firstContent(); }

document.addEventListener("keydown", e=>{
  const k=e.key, ae=document.activeElement, inInput=ae&&ae.tagName==="INPUT";
  if($("#player").classList.contains("on") && playerKey(e)) return;
  const dirs={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
  if(dirs[k]){
    if(inInput && (k==="ArrowLeft"&&ae.selectionStart>0 || k==="ArrowRight"&&ae.selectionEnd<ae.value.length)) return;
    e.preventDefault(); move(dirs[k]); return;
  }
  if(k==="Escape" || k==="GoBack" || k==="BrowserBack" || (k==="Backspace" && !inInput)){ e.preventDefault(); fvBack(); }
});
document.addEventListener("focusin", e=>{ if(e.target.classList && e.target.classList.contains("f")) revealEl(e.target); });

/* Back button. Returns true if handled; false lets the Android app exit. */
window.fvBack = function(){
  if($("#modal").classList.contains("on")){ closeModal(); return true; }
  if($("#player").classList.contains("on")){ if(!osdHidden && !video.paused){ hideOsd(); return true; } closePlayer(); return true; }
  if($("#panel").classList.contains("on")){ closePanel(); return true; }
  if(document.activeElement && document.activeElement.closest("#rail") && current!=="home"){ go("home"); return true; }
  if(stack.length){ const p=stack.pop(); show(p); return true; }
  if(current!=="home"){ go("home"); return true; }
  const ae=document.activeElement;
  if(ae && !ae.closest("#rail")){ focusEl($("#rail .cur")); return true; }
  return false;
};

/* ================= views ================= */
let current="home"; const stack=[];
function show(view){
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on", v.id==="v-"+view));
  current=view;
  const navv = ["home","search","library","addons"].includes(view) ? view : null;
  if(navv) document.querySelectorAll("#rail [data-nav]").forEach(b=>b.classList.toggle("cur", b.dataset.nav===navv));
  requestAnimationFrame(()=>focusEl(defaultFocus()));
}
function go(view){ stack.length=0;
  if(view==="home") renderHome(); if(view==="library") renderLibrary(); if(view==="addons") renderAddons();
  show(view); if(view==="search") setTimeout(()=>focusEl($("#searchInput")),30);
}
function push(view){ if(current!==view) stack.push(current); show(view); }
document.querySelectorAll("#rail [data-nav]").forEach(b=>b.addEventListener("click",()=>{ lastFocus[b.dataset.nav]=null; go(b.dataset.nav); }));
$("#railRefresh").onclick=()=>{ cache.clear(); refreshManifests(); lastFocus.home=null; go("home"); toast("Refreshed"); };

/* ================= cards ================= */
const metaStash=new Map();
const stash=ms=>ms.forEach(m=>{ if(m&&m.id&&!metaStash.has(m.id)) metaStash.set(m.id,m); });
function cardHTML(m,o={}){
  const p=progress[m.id]; const pct=p&&p.d?Math.min(100,p.t/p.d*100):0;
  const img=o.wide?(m.background||m.poster):m.poster;
  return `<button class="card f${o.wide?" wide":""}" data-id="${esc(m.id)}" data-type="${esc(m.type)}" data-hover="1"${o.resume?' data-resume="1"':""}>
    <div class="pst" style="background-image:${esc(cssUrl(img))}">${img?"":`<div class="ph">${esc(m.name)}</div>`}${pct?`<div class="prog"><i style="width:${pct}%"></i></div>`:""}</div>
    <div class="nm">${esc(o.label||m.name)}</div></button>`;
}
document.addEventListener("click", e=>{
  const c=e.target.closest(".card[data-id]"); if(!c) return;
  if(c.dataset.resume){ const p=progress[c.dataset.id]; if(p) return openDetail(p.type,p.id,true); }
  openDetail(c.dataset.type,c.dataset.id);
});

/* ================= home ================= */
let homeTok=0, homeCats=[];
function renderHome(){
  const tok=++homeTok; const on=enabled(); const rows=$("#homeRowsIn"); $("#homeRowsIn").style.transform="";
  setBrandHero();
  if(!on.length){
    $("#homeInfo").innerHTML="";
    rows.innerHTML=`<div class="empty" style="padding-top:0"><h2>No addons plugged in</h2><p>Add a catalog addon to fill this screen, and stream addons to play things.</p>
      <div class="actions" style="justify-content:center"><button class="btn primary f" id="goAdd">Plug in an addon</button></div></div>`;
    $("#homeRows").style.top="26.5rem"; $("#goAdd").onclick=()=>go("addons"); return;
  }
  let html="";
  const cw=Object.values(progress).sort((a,b)=>b.at-a.at).slice(0,20);
  if(cw.length) html+=`<div class="row"><h3>Continue watching</h3><div class="scroller">${cw.map(p=>cardHTML({id:p.id,type:p.type,name:p.name,poster:p.poster,background:p.background,description:p.description},{wide:true,resume:true,label:p.epLabel?`${p.name} · ${p.epLabel}`:p.name})).join("")}</div></div>`;
  homeCats=[]; on.forEach(a=>(a.manifest.catalogs||[]).forEach(c=>{ if(!catExtras(c).some(x=>x.isRequired)) homeCats.push({a,c}); }));
  html+=homeCats.map((x,i)=>`<div class="row" id="hc-${i}"><h3>${esc(x.c.name||x.c.id)} <small>${esc(x.c.type)} · ${esc(x.a.manifest.name)}</small></h3>
     <div class="scroller"><div class="loader"><div class="spin"></div>Loading…</div></div></div>`).join("");
  if(!homeCats.length && !cw.length) html+=`<div class="empty" style="padding-top:0"><h2>No catalogs yet</h2><p>Your addons don't provide catalogs. Add one like Cinemeta under Addons.</p></div>`;
  rows.innerHTML=html;
  homeCats.forEach(async(x,i)=>{
    const row=$("#hc-"+i);
    try{ const r=await getJSON(catUrl(x.a,x.c)); if(tok!==homeTok) return;
      const ms=(r.metas||[]).filter(m=>m&&m.id).map(m=>({...m,type:m.type||x.c.type})); stash(ms);
      if(!ms.length){ row.remove(); return; }
      row.querySelector(".scroller").innerHTML=ms.slice(0,40).map(m=>cardHTML(m)).join("")+`<button class="card more f" data-browse="${i}"><div class="pst">SEE ALL ›</div><div class="nm">&nbsp;</div></button>`;
      row.querySelector("[data-browse]").onclick=()=>browse(x);
      if(document.activeElement===document.body || (current==="home" && !document.activeElement.closest("#v-home") && !document.activeElement.closest("#rail"))) focusEl(defaultFocus());
    }catch(e){ if(tok!==homeTok) return; row.querySelector(".scroller").innerHTML=`<div class="note" style="color:#ff8b8f">Couldn't load this catalog (${esc(e.name==="AbortError"?"timed out":e.message)}).</div>`; }
  });
}
function setBrandHero(){
  $("#homeBg").className="brand"; $("#homeBg").style.backgroundImage="";
  $("#homeInfo").innerHTML=`<div class="tag k">plug in the revolution</div><h2>Forbidden<br><span style="color:var(--toxic);text-shadow:0 0 1.4rem var(--glow)">VOD</span></h2>
    <div class="d">${enabled().length} addon${enabled().length===1?"":"s"} plugged in.</div>`;
}
let heroT=null;
function heroFromCard(el){
  if(!el.closest("#v-home")) return;
  clearTimeout(heroT); heroT=setTimeout(()=>{
    const id=el.dataset.id; if(!id) return; const m=metaStash.get(id) || progress[id] || {};
    const bg=$("#homeBg"); bg.className=""; bg.style.backgroundImage=cssUrl(m.background||m.poster);
    const p=progress[id];
    $("#homeInfo").innerHTML=`<div class="tag k">plug in the revolution</div>
      ${m.logo?`<img class="lg" src="${esc(m.logo)}" alt="${esc(m.name)}" onerror="this.outerHTML='<h2>'+this.alt.replace(/</g,'&lt;')+'</h2>'">`:`<h2>${esc(m.name||"")}</h2>`}
      <div class="mline">${m.imdbRating?`<span class="imdb">IMDb ${esc(m.imdbRating)}</span>`:""}${m.releaseInfo||m.year?`<span>${esc(m.releaseInfo||m.year)}</span>`:""}${m.runtime?`<span>${esc(m.runtime)}</span>`:""}${m.type?`<span class="chip">${esc(m.type)}</span>`:""}${p&&p.epLabel?`<span class="chip g">Up next ${esc(p.epLabel)}</span>`:""}</div>
      ${m.description?`<div class="d">${esc(m.description)}</div>`:""}`;
  },140);
}

/* ================= browse / see all ================= */
async function browse(x){
  push("browse");
  const el=$("#browseBody");
  el.innerHTML=`<div class="vpad"><h1 class="vt">${esc(x.c.name||x.c.id)}</h1><p class="vs">${esc(x.c.type)} · ${esc(x.a.manifest.name)}</p></div><div class="grid" id="bgrid"></div><div class="vpad" id="bmore" style="margin-top:2rem"></div>`;
  let skip=0; const canSkip=catExtras(x.c).some(e=>e.name==="skip");
  const load=async()=>{
    $("#bmore").innerHTML=`<div class="loader"><div class="spin"></div>Loading…</div>`;
    try{ const r=await getJSON(catUrl(x.a,x.c,skip?{skip}:null)); const ms=(r.metas||[]).filter(m=>m&&m.id).map(m=>({...m,type:m.type||x.c.type})); stash(ms);
      const first=!skip; $("#bgrid").insertAdjacentHTML("beforeend",ms.map(m=>cardHTML(m)).join("")); skip+=ms.length;
      $("#bmore").innerHTML=canSkip&&ms.length?`<button class="btn f" id="bmoreBtn">Load more</button>`:"";
      const b=$("#bmoreBtn"); if(b) b.onclick=()=>{ const prev=$("#bgrid").lastElementChild; load().then(()=>{ const n=prev&&prev.nextElementSibling; if(n) focusEl(n); }); };
      if(first && current==="browse") focusEl($("#bgrid .card"));
    }catch(e){ $("#bmore").innerHTML=`<div class="note" style="color:#ff8b8f">Couldn't load (${esc(e.message)})</div>`; }
  };
  return load();
}

/* ================= search ================= */
$("#searchForm").addEventListener("submit", e=>{ e.preventDefault(); doSearch(); });
async function doSearch(){
  const q=$("#searchInput").value.trim(); if(!q) return;
  const out=$("#searchResults"); const cats=[];
  enabled().forEach(a=>(a.manifest.catalogs||[]).forEach(c=>{ if(catExtras(c).some(x=>x.name==="search")) cats.push({a,c}); }));
  if(!cats.length){ out.innerHTML=`<div class="empty"><h2>Nothing to search with</h2><p>None of your addons support search. Add Cinemeta under Addons.</p></div>`; return; }
  out.innerHTML=cats.map((x,i)=>`<div class="row" id="sr-${i}"><h3>${esc(x.c.name||x.c.type)} <small>${esc(x.c.type)} · ${esc(x.a.manifest.name)}</small></h3><div class="scroller"><div class="loader"><div class="spin"></div>Searching…</div></div></div>`).join("");
  let any=false,done=0,focused=false;
  cats.forEach(async(x,i)=>{
    const row=$("#sr-"+i);
    try{ const r=await getJSON(catUrl(x.a,x.c,{search:q})); const ms=(r.metas||[]).filter(m=>m&&m.id).map(m=>({...m,type:m.type||x.c.type})); stash(ms);
      if(!ms.length) row.remove(); else { any=true; row.querySelector(".scroller").innerHTML=ms.map(m=>cardHTML(m)).join("");
        if(!focused && current==="search"){ focused=true; focusEl(row.querySelector(".card")); } }
    }catch(e){ row.remove(); }
    if(++done===cats.length && !any) out.innerHTML=`<div class="empty"><h2>No results</h2><p>Nothing found for “${esc(q)}”.</p></div>`;
  });
}

/* ================= library ================= */
function renderLibrary(){
  const items=Object.values(library).sort((a,b)=>b.added-a.added);
  $("#libBody").innerHTML=`<div class="vpad"><h1 class="vt">Library</h1><p class="vs">Titles you've saved on this TV.</p></div>`+
    (items.length?`<div class="grid">${items.map(m=>cardHTML(m)).join("")}</div>`:`<div class="empty"><h2>Nothing saved yet</h2><p>Choose “Add to library” on any title to keep it here.</p></div>`);
}

/* ================= addons ================= */
function renderAddons(){
  const el=$("#addBody"); const sugg=SUGGESTED.filter(s=>!addons.some(a=>s.match?s.match.test(a.url)||s.match.test(a.manifest.name||""):a.url===s.url));
  el.innerHTML=`<div class="vpad">
    <h1 class="vt">Addons</h1><p class="vs">Enter a Stremio-compatible addon link (<b>…/manifest.json</b> or <b>stremio://</b>). Tip: use the Google TV app on your phone to paste links into the TV keyboard.</p>
    <form class="field" id="addForm"><input class="f" id="addUrl" type="url" placeholder="https://…/manifest.json" autocomplete="off" inputmode="url"><button class="btn primary f" type="submit">Install</button></form>
    <div class="secth">Installed <span class="chip g">${addons.length}</span></div>
    ${addons.length?addons.map((a,i)=>{ const m=a.manifest, res=(m.resources||[]).map(r=>typeof r==="string"?r:r.name), logo=m.logo||m.icon;

function pickStream(r){

const resolvedCache=new Map();
let resolving=false;
async function playTorrent(r){
  if(resolving) return; resolving=true;
  const s=r.s, btn=document.activeElement, sa=btn&&btn.querySelector(".sa"), orig=sa&&sa.textContent;
  const ck=s.infoHash+":"+(s.fileIdx??"")+":"+(debrid().provider);

    $("#panel").classList.remove("on"); playStream({...s,url},panelCtx);
  }catch(e){ if(sa) sa.textContent=orig; toast(e.message,true); }

/* ================= debrid services ================= */
const DEBRIDS = {
  torbox:     {name:"TorBox",      keyPage:"torbox.app/settings",           keyHint:"Settings → API Key"},
  realdebrid: {name:"Real-Debrid", keyPage:"real-debrid.com/apitoken",      keyHint:"your API token", device:true},
  premiumize: {name:"Premiumize",  keyPage:"premiumize.me/account",         keyHint:"Account → API Key"}
};
const RD_OPEN_CLIENT="X35INKNOGQLPJ"; // Real-Debrid's public client id for open-source apps
const debrid = ()=> settings.debrid && settings.debrid.provider ? settings.debrid : null;
const debridName = ()=> debrid() ? DEBRIDS[debrid().provider].name : "";
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
async function dfetch(url, opt={}, timeout=20000){
  const c=new AbortController(); const h=setTimeout(()=>c.abort(),timeout);
  try{ const r=await fetch(url,{...opt,signal:c.signal}); let j=null; try{ j=await r.json(); }catch(e){}
    if(!r.ok){ const m=j&&(j.detail||j.error||j.message)||("HTTP "+r.status); const e=new Error(m); e.status=r.status; throw e; } return j;
  } finally{ clearTimeout(h); }
}
const form = o=>{ const f=new URLSearchParams(); Object.entries(o).forEach(([k,v])=>f.append(k,v)); return f; };
const VIDEO_RE=/\.(mkv|mp4|m4v|avi|mov|webm|ts|m2ts|wmv|mpg|mpeg)$/i;
function pickFile(files, s){
  // files: [{id, name, size}]
  const want=s.behaviorHints&&s.behaviorHints.filename;
  if(want){ const f=files.find(f=>(f.name||"").split("/").pop()===want); if(f) return f; }
  const vids=files.filter(f=>VIDEO_RE.test(f.name||""));
  const pool=vids.length?vids:files;
  if(Number.isInteger(s.fileIdx) && s.fileIdx>=0 && s.fileIdx<files.length && VIDEO_RE.test(files[s.fileIdx].name||"")) return files[s.fileIdx];
  return pool.slice().sort((a,b)=>(b.size||0)-(a.size||0))[0];
}

/* --- Real-Debrid token handling --- */
async function rdToken(){
  const d=debrid(); if(!d) throw new Error("not connected");
  if(!d.rd) return d.key; // plain API token
  if(d.rd.expires && Date.now() < d.rd.expires-60000) return d.rd.token;
  const j=await dfetch("https://api.real-debrid.com/oauth/v2/token",{method:"POST",body:form({client_id:d.rd.client_id,client_secret:d.rd.client_secret,code:d.rd.refresh,grant_type:"http://oauth.net/grant_type/device/1.0"})});
  d.rd.token=j.access_token; d.rd.refresh=j.refresh_token||d.rd.refresh; d.rd.expires=Date.now()+(j.expires_in||3600)*1000; saveSettings();
  return d.rd.token;
}
const rdApi = async (path,opt={})=>{ const t=await rdToken(); return dfetch("https://api.real-debrid.com/rest/1.0"+path,{...opt,headers:{Authorization:"Bearer "+t}}); };

/* --- account check (returns {user, expires}) --- */
async function debridAccount(provider, key){
  if(provider==="torbox"){
    const j=await dfetch("https://api.torbox.app/v1/api/user/me?settings=false",{headers:{Authorization:"Bearer "+key}});
    const u=j.data||{}; return {user:u.email||"TorBox user", expires:u.premium_expires_at||null, plan:u.plan};
  }
  if(provider==="realdebrid"){
    const j=await rdApi("/user"); return {user:j.username||j.email, expires:j.expiration||null, plan:j.type};
  }
  if(provider==="premiumize"){
    const j=await dfetch("https://www.premiumize.me/api/account/info?apikey="+encodeURIComponent(key));
    if(j.status!=="success") throw new Error(j.message||"Invalid API key");
    return {user:"Customer "+j.customer_id, expires:j.premium_until?new Date(j.premium_until*1000).toISOString():null};
  }
}

/* --- turn a torrent stream into a playable link --- */
async function resolveTorrent(s, onStatus){
  const d=debrid(); if(!d) throw new Error("Connect a debrid service in Addons first");
  const hash=String(s.infoHash).toLowerCase();
  const magnet=`magnet:?xt=urn:btih:${hash}`+(s.title?`&dn=${encodeURIComponent(String(s.title).split("\n")[0])}`:"")+((s.sources||[]).filter(x=>/^tracker:/.test(x)).slice(0,10).map(x=>"&tr="+encodeURIComponent(x.slice(8))).join(""));

  if(d.provider==="torbox"){
    const H={Authorization:"Bearer "+d.key};
    onStatus&&onStatus("Asking TorBox…");
    let id=null;
    try{ const j=await dfetch("https://api.torbox.app/v1/api/torrents/createtorrent",{method:"POST",headers:H,body:form({magnet, seed:"3", allow_zip:"false"})});
      id=j.data&&(j.data.torrent_id||j.data.id); }catch(e){ if(e.status===401||e.status===403) throw new Error("TorBox rejected your API key"); }
    for(let i=0;i<40;i++){
      const j=await dfetch("https://api.torbox.app/v1/api/torrents/mylist?bypass_cache=true"+(id?"&id="+id:""),{headers:H});
      let t=j.data; if(Array.isArray(t)) t=t.find(x=>String(x.hash).toLowerCase()===hash);
      if(t){ id=t.id;
        if(t.download_present||t.download_finished){
          const files=(t.files||[]).map(f=>({id:f.id,name:f.short_name||f.name,size:f.size}));
          const f=pickFile(files,s); if(!f) throw new Error("No playable file in this torrent");
          return `https://api.torbox.app/v1/api/torrents/requestdl?token=${encodeURIComponent(d.key)}&torrent_id=${t.id}&file_id=${f.id}&redirect=true`;
        }
        onStatus&&onStatus(`TorBox is caching it… ${Math.round((t.progress||0)*100)}%`);
        if(i>=6 && !(t.progress>0)) throw new Error("Not cached on TorBox yet — it's downloading in your TorBox account. Try again later or pick a ⚡ cached stream.");
      }
      await sleep(3000);
    }
    throw new Error("TorBox is still downloading this one. Try again in a few minutes.");
  }

  if(d.provider==="realdebrid"){
    onStatus&&onStatus("Asking Real-Debrid…");
    const add=await rdApi("/torrents/addMagnet",{method:"POST",body:form({magnet})});
    let info=await rdApi("/torrents/info/"+add.id);
    if(info.status==="waiting_files_selection"||info.status==="magnet_conversion"){
      for(let i=0;i<10&&info.status==="magnet_conversion";i++){ await sleep(1500); info=await rdApi("/torrents/info/"+add.id); }
      const files=(info.files||[]).map(f=>({id:f.id,name:f.path,size:f.bytes}));
      const f=pickFile(files,s); if(!f) throw new Error("No playable file in this torrent");
      await rdApi("/torrents/selectFiles/"+add.id,{method:"POST",body:form({files:String(f.id)})});
    }
    for(let i=0;i<8;i++){
      info=await rdApi("/torrents/info/"+add.id);
      if(info.status==="downloaded" && info.links&&info.links.length){
        const u=await rdApi("/unrestrict/link",{method:"POST",body:form({link:info.links[0]})});
        return u.download;
      }
      if(["error","magnet_error","virus","dead"].includes(info.status)) throw new Error("Real-Debrid couldn't get this torrent ("+info.status+")");
      onStatus&&onStatus(`Real-Debrid: ${info.status.replace(/_/g," ")} ${info.progress?Math.round(info.progress)+"%":""}`);
      await sleep(2500);
    }
    throw new Error("Not cached on Real-Debrid — it's downloading in your account. Try again later.");
  }

  if(d.provider==="premiumize"){
    onStatus&&onStatus("Asking Premiumize…");
    const j=await dfetch("https://www.premiumize.me/api/transfer/directdl",{method:"POST",body:form({apikey:d.key,src:magnet})});
    if(j.status!=="success"||!(j.content||[]).length) throw new Error("Not cached on Premiumize. Pick another stream.");
    const files=j.content.map((c,i)=>({id:i,name:c.path,size:c.size,link:c.stream_link||c.link}));
    const f=pickFile(files,s); return f.link;
  }
  throw new Error("Unknown debrid service");
}

/* --- connect screens --- */
let rdPoll=null;
function stopRdPoll(){ if(rdPoll){ rdPoll.stop=true; rdPoll=null; } }
function connectDebrid(provider){
  stopRdPoll(); modalReturn=document.activeElement;
  const P=DEBRIDS[provider];
  $("#modalBox").innerHTML=`<h2>Connect ${esc(P.name)}</h2>
    ${P.device?`<div id="rdBox" class="note" style="font-size:1.4rem;margin:1rem 0 2rem"><div class="loader"><div class="spin"></div>Getting a code…</div></div><p style="margin-bottom:.8rem">Or paste an API token instead:</p>`:
      `<ol style="font-size:1.35rem;line-height:1.7;color:var(--muted);padding-left:2.2rem;margin:1rem 0 1.6rem">
        <li>On your phone, open <b style="color:var(--toxic);font-size:1.5rem">${esc(P.keyPage)}</b> and copy ${esc(P.keyHint)}.</li>
        <li>Paste it below (the Google TV app on your phone can paste for you), then choose Connect.</li></ol>`}
    <form class="field" id="dkForm" style="margin-bottom:0"><input class="f" id="dkInput" type="password" placeholder="${esc(P.name)} API key" autocomplete="off"><button class="btn primary f" type="submit">Connect</button></form>
    <p id="dkMsg" style="min-height:2rem;margin-top:1rem"></p>
    <div class="actions" style="margin-top:.6rem"><button class="btn f" id="mNo">Cancel</button></div>`;
  $("#modal").classList.add("on"); focusEl(P.device?$("#mNo"):$("#dkInput"));
  $("#mNo").onclick=()=>{ stopRdPoll(); closeModal(); };
  $("#dkForm").onsubmit=async e=>{ e.preventDefault(); const key=$("#dkInput").value.trim(); if(!key) return;
    await finishConnect({provider,key}); };
  if(P.device) startRdDevice();
}
async function finishConnect(cfg){
  const msg=$("#dkMsg"); if(msg){ msg.style.color="var(--muted)"; msg.textContent="Checking…"; }
  const prev=settings.debrid; settings.debrid=cfg;
  try{ const acct=await debridAccount(cfg.provider,cfg.key); cfg.account=acct; saveSettings(); stopRdPoll(); closeModal();
    toast(`${DEBRIDS[cfg.provider].name} connected — ${acct.user}`); renderAddons(); focusEl($("#dbManage")||$("#addUrl")); return true;
  }catch(e){ settings.debrid=prev; saveSettings(); if(msg){ msg.style.color="#ff8b8f"; msg.textContent="That didn't work: "+e.message; } return false; }
}
async function startRdDevice(){
  const poll={stop:false}; rdPoll=poll; const box=$("#rdBox");
  try{
    const c=await dfetch(`https://api.real-debrid.com/oauth/v2/device/code?client_id=${RD_OPEN_CLIENT}&new_credentials=yes`);
    if(poll.stop) return;
    box.innerHTML=`On your phone, go to <b style="color:var(--toxic);font-size:1.6rem">${esc((c.verification_url||"real-debrid.com/device").replace(/^https?:\/\//,""))}</b> and enter:
      <div class="bungee" style="font-family:Bungee,Impact,sans-serif;font-size:4.4rem;letter-spacing:.2em;color:#fff;text-shadow:0 0 1.4rem var(--glow);margin:1rem 0">${esc(c.user_code)}</div>
      <div class="loader"><div class="spin"></div>Waiting for you to approve…</div>`;
    const end=Date.now()+(c.expires_in||600)*1000;
    while(!poll.stop && Date.now()<end){
      await sleep((c.interval||5)*1000); if(poll.stop) return;
      let cred=null; try{ cred=await dfetch(`https://api.real-debrid.com/oauth/v2/device/credentials?client_id=${RD_OPEN_CLIENT}&code=${encodeURIComponent(c.device_code)}`); }catch(e){}
      if(cred&&cred.client_secret){
        const t=await dfetch("https://api.real-debrid.com/oauth/v2/token",{method:"POST",body:form({client_id:cred.client_id,client_secret:cred.client_secret,code:c.device_code,grant_type:"http://oauth.net/grant_type/device/1.0"})});
        await finishConnect({provider:"realdebrid",key:"",rd:{client_id:cred.client_id,client_secret:cred.client_secret,token:t.access_token,refresh:t.refresh_token,expires:Date.now()+(t.expires_in||3600)*1000}});
        return;
      }
    }
    if(!poll.stop) box.innerHTML=`<span style="color:#ff8b8f">The code expired.</span> Close this and try again.`;
  }catch(e){ if(!poll.stop) box.innerHTML=`<span style="color:#ff8b8f">Couldn't reach Real-Debrid (${esc(e.message)}).</span> You can paste an API token below instead.`; }
}
function debridSectionHTML(){
  const d=debrid();
  if(d){ const a=d.account||{}; const exp=a.expires?new Date(a.expires):null;
    return `<div class="addon"><div class="lg" style="color:var(--toxic)">⚡</div><div class="bd"><div class="nm">${esc(DEBRIDS[d.provider].name)}<small>connected</small></div>
      <div class="ds">${esc(a.user||"")}${exp&&!isNaN(exp)?` · premium until ${esc(exp.toLocaleDateString())}`:""}${a.plan!=null?` · plan ${esc(a.plan)}`:""}</div>
      <div class="chips"><span class="chip g">torrent streams play through ${esc(DEBRIDS[d.provider].name)}</span></div></div>
      <div class="ab"><button class="btn sm f" id="dbManage">Check</button><button class="btn sm danger f" id="dbOff">Disconnect</button></div></div>`;
  }
  return `<p class="note" style="margin-bottom:1.2rem">Connect your own debrid account so torrent results from your addons play instantly.</p>
    <div class="actions" style="margin-top:0">${Object.entries(DEBRIDS).map(([k,v])=>`<button class="btn f" data-dconnect="${k}">Connect ${esc(v.name)}</button>`).join("")}</div>`;
}
function wireDebridSection(rerender){
  document.querySelectorAll("[data-dconnect]").forEach(b=>b.onclick=()=>connectDebrid(b.dataset.dconnect));
  const m=$("#dbManage"); if(m) m.onclick=async()=>{ try{ const d=debrid(); d.account=await debridAccount(d.provider,d.key); saveSettings(); toast(`${debridName()} OK — ${d.account.user}`); rerender("#dbManage"); }catch(e){ toast(`${debridName()} problem: ${e.message}`,true); } };
  const o=$("#dbOff"); if(o) o.onclick=()=>confirmModal(`Disconnect ${debridName()}?`,"Torrent streams will stop playing until you connect again.","Disconnect",()=>{ settings.debrid=null; saveSettings(); rerender(); });
}

/* ================= player ================= */
const video=$("#video"); let hls=null, pctx=null, osdHidden=false, osdT=null, lastSave=0, subsList=[], subIdx=-1;
function loadHls(){ if(window.Hls) return Promise.resolve(); return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function externalPlay(url,title){
  if(NATIVE){ window.Android.openExternal(url,title||""); return; }
  location.href=`intent:${url}#Intent;action=android.intent.action.VIEW;type=video/*;S.title=${encodeURIComponent(title||"")};end`;
}
function recordProgress(meta,ctx,t,d){
  progress[meta.id]={id:meta.id,type:meta.type,name:meta.name,poster:meta.poster,background:meta.background,description:meta.description,videoId:ctx.videoId,epLabel:ctx.epLabel,t,d,at:Date.now()}; saveProg();
}
async function playStream(s,ctx){
  const m=curMeta; const url=s.url; const title=`${m.name}${ctx.epLabel?" · "+ctx.epLabel:""}`;
  if(settings.player==="external"){ recordProgress(m,ctx,0,0); externalPlay(url,title); toast("Opening in your external player…"); if(panelReturn&&document.contains(panelReturn)) focusEl(panelReturn); return; }
  pctx={...ctx,meta:{id:m.id,type:m.type,name:m.name,poster:m.poster,background:m.background,description:m.description},stream:s};
  $("#pTitle").textContent=title; $("#pSub").textContent=(s.name||"").replace(/\n/g," ")+(s.title?" · "+s.title.split("\n")[0]:"");
  $("#player").classList.add("on"); setMsg(`<div class="spin"></div>`); showOsd(); focusEl($("#pPlay"));
  if(NATIVE&&window.Android.keepScreenOn) window.Android.keepScreenOn(true);
  if(hls){ hls.destroy(); hls=null; } video.removeAttribute("src"); [...video.querySelectorAll("track")].forEach(t=>t.remove());
  const isHls=/\.m3u8(\?|$)/i.test(url);
  try{
    if(isHls){ await loadHls().catch(()=>{}); if(window.Hls&&Hls.isSupported()){ hls=new Hls(); hls.loadSource(url); hls.attachMedia(video); hls.on(Hls.Events.ERROR,(e,d)=>{ if(d.fatal) playErr(); }); } else video.src=url; }
    else video.src=url;
  }catch(e){ video.src=url; }
  const p=progress[m.id]; const at=p&&p.videoId===ctx.videoId&&p.t>30&&p.d&&p.t<p.d-60?p.t:0;
  video.onloadedmetadata=()=>{ if(at){ video.currentTime=at; toast("Resuming at "+fmt(at)); } };
  video.play().catch(()=>{});
  loadSubs(ctx);
}
function setMsg(h){ $("#pMsg").innerHTML=h; }
function playErr(){
  setMsg(`<div style="color:#ff9ea2;font-weight:700;font-size:1.8rem;margin-bottom:1rem">Can't play this stream here</div>The format (often MKV / HEVC / Dolby audio) isn't supported by the built-in player.<br>Try <b>Open in external player</b> or pick <b>Other streams</b>.`);
  showOsd(true); focusEl($("#pExt"));
}
video.addEventListener("error",()=>{ if($("#player").classList.contains("on")&&video.getAttribute("src")) playErr(); });
video.addEventListener("waiting",()=>setMsg(`<div class="spin"></div>`));
video.addEventListener("playing",()=>{ setMsg(""); scheduleHide(); });
video.addEventListener("play",updPlayBtn); video.addEventListener("pause",()=>{ updPlayBtn(); showOsd(true); });
video.addEventListener("timeupdate",()=>{ updBar(); if(!pctx||!isFinite(video.duration)) return; const n=Date.now(); if(n-lastSave>5000){ lastSave=n; saveP(); } });
video.addEventListener("progress",updBar);
video.addEventListener("ended",()=>{ saveP(); closePlayer(); });
function updPlayBtn(){ $("#pPlay").innerHTML=video.paused?`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg><span>Play</span>`:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg><span>Pause</span>`; }
function updBar(){ const d=video.duration; if(!d||!isFinite(d)) return; const pc=video.currentTime/d*100; $("#pPos").style.width=pc+"%"; $("#pKnob").style.left=pc+"%";
  try{ const b=video.buffered; if(b.length) $("#pBuf").style.width=(b.end(b.length-1)/d*100)+"%"; }catch(e){}
  $("#pCur").textContent=fmt(video.currentTime); $("#pDur").textContent=fmt(d); }
function saveP(){ if(!pctx||!video.duration||!isFinite(video.duration)) return; const {meta}=pctx;
  if(video.currentTime>video.duration-90 && !pctx.epLabel){ delete progress[meta.id]; saveProg(); } else recordProgress(meta,pctx,video.currentTime,video.duration); }
function showOsd(stay){ osdHidden=false; $("#osd").classList.remove("hide"); clearTimeout(osdT); if(!stay) scheduleHide(); }
function hideOsd(){ if(video.paused) return; osdHidden=true; $("#osd").classList.add("hide"); focusEl($("#pPlay")); }
function scheduleHide(){ clearTimeout(osdT); osdT=setTimeout(hideOsd,4500); }
let seekAcc=0, seekT=null;
function seek(delta){ if(!isFinite(video.duration)) return; seekAcc+=delta; video.currentTime=Math.max(0,Math.min(video.duration-1,video.currentTime+delta));
  const h=$("#seekHint"); h.textContent=(seekAcc>0?"+":"−")+Math.abs(seekAcc)+"s"; h.style.left=seekAcc>0?"70%":"22%"; h.classList.add("on");
  clearTimeout(seekT); seekT=setTimeout(()=>{ h.classList.remove("on"); seekAcc=0; },800); updBar(); }
function playerKey(e){
  if($("#modal").classList.contains("on")) return false;
  const k=e.key;
  if(k==="MediaPlayPause"||k===" "&&osdHidden){ e.preventDefault(); video.paused?video.play():video.pause(); return true; }
  if(k==="MediaPlay"){ video.play(); return true; } if(k==="MediaPause"){ video.pause(); return true; }
  if(k==="MediaFastForward"){ seek(30); return true; } if(k==="MediaRewind"){ seek(-10); return true; }
  if(osdHidden){
    if(k==="ArrowLeft"){ e.preventDefault(); seek(-10); return true; }
    if(k==="ArrowRight"){ e.preventDefault(); seek(30); return true; }
    if(k==="ArrowUp"||k==="ArrowDown"){ e.preventDefault(); showOsd(); focusEl($("#pPlay")); return true; }
    if(k==="Enter"){ showOsd(); return false; } // native click on focused Play button toggles
    return false;
  }
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Enter"].includes(k)){ showOsd(video.paused); }
  return false;
}
$("#pPlay").onclick=()=>{ video.paused?video.play():video.pause(); };
$("#pBack10").onclick=()=>{ seek(-10); scheduleHide(); }; $("#pFwd30").onclick=()=>{ seek(30); scheduleHide(); };
$("#pExt").onclick=()=>{ const u=pctx&&pctx.stream.url, t=$("#pTitle").textContent; saveP(); closePlayer(); if(u) externalPlay(u,t); };
$("#pOther").onclick=()=>{ const c=pctx; saveP(); closePlayer(); if(c) openStreams(c,{}); };
$("#pSubs").onclick=()=>{ if(!subsList.length){ toast("No subtitles from your addons for this title"); return; } subIdx=subIdx+1>=subsList.length?-1:subIdx+1; applySub(); };
function closePlayer(){
  saveP(); video.pause(); if(hls){ hls.destroy(); hls=null; } video.removeAttribute("src"); video.load(); setMsg("");
  $("#player").classList.remove("on"); clearTimeout(osdT); pctx=null;
  if(NATIVE&&window.Android.keepScreenOn) window.Android.keepScreenOn(false);
  if(current==="detail"&&curMeta){ const id=panelReturn&&panelReturn.id, vid=panelReturn&&panelReturn.dataset&&panelReturn.dataset.vid; drawDetail(false);
    focusEl((vid&&$(`#detBody [data-vid="${CSS.escape(vid)}"]`))||(id&&$("#"+id))||$("#dMain")); }
}
function srtToVtt(t){ return "WEBVTT\n\n"+t.replace(/\r/g,"").replace(/(\d\d:\d\d:\d\d),(\d\d\d)/g,"$1.$2"); }
async function loadSubs(ctx){
  subsList=[]; subIdx=-1; $("#pSubs").textContent="Subtitles: off";
  const provs=enabled().filter(a=>supports(a,"subtitles",ctx.type,ctx.videoId));
  await Promise.all(provs.map(async a=>{ try{ const r=await getJSON(`${baseOf(a.url)}/subtitles/${encodeURIComponent(ctx.type)}/${encodeURIComponent(ctx.videoId)}.json`); (r.subtitles||[]).forEach(s=>s.url&&subsList.push(s)); }catch(e){} }));
  const pref=(navigator.language||"en").slice(0,2); const good=s=>/^(en|eng)/i.test(s.lang||"")||(s.lang||"").startsWith(pref);
  subsList.sort((a,b)=>good(b)-good(a)); subsList=subsList.slice(0,40);
  if(subsList.length) $("#pSubs").textContent=`Subtitles: off (${subsList.length})`;
}
async function applySub(){
  [...video.querySelectorAll("track")].forEach(t=>t.remove());
  if(subIdx<0){ $("#pSubs").textContent=`Subtitles: off (${subsList.length})`; return; }
  const s=subsList[subIdx]; $("#pSubs").textContent=`Subtitles: ${s.lang||"?"} ${subIdx+1}/${subsList.length}`;
  try{ const txt=await (await fetch(s.url)).text(); const blob=new Blob([/^WEBVTT/.test(txt)?txt:srtToVtt(txt)],{type:"text/vtt"});
    const tr=document.createElement("track"); tr.kind="subtitles"; tr.default=true; tr.src=URL.createObjectURL(blob); tr.srclang="xx"; tr.label=s.lang||"Sub"; video.appendChild(tr); tr.track.mode="showing";
  }catch(e){ toast("Couldn't load that subtitle",true); }
}
const subStyle=document.createElement("style"); subStyle.textContent="video::cue{font-size:2.6rem;background:rgba(0,0,0,.65);color:#fff;font-family:Rubik,sans-serif}"; document.head.appendChild(subStyle);

/* hooks used by the Android TV app */
window.fvMedia=function(k){ if(!$("#player").classList.contains("on")) return; if(k==="MediaStop"){ closePlayer(); return; } playerKey({key:k,preventDefault(){}}); };
window.fvPause=function(){ if($("#player").classList.contains("on") && !video.paused){ video.pause(); saveP(); } };

/* ================= boot ================= */
function refreshManifests(){ addons.forEach(async a=>{ try{ const m=await getJSON(a.url,{nocache:true}); if(m&&m.id){ a.manifest=m; saveAddons(); } }catch(e){} }); }
refreshManifests();
renderHome();
requestAnimationFrame(()=>focusEl(defaultFocus()));
</script>
