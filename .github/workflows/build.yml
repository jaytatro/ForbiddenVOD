name: Build Forbidden Vid

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forbiddenvid-build
  cancel-in-progress: true

env:
  # NuvioTV source version the Forbidden Vid patch is based on (Nuvio 1.1.1).
  NUVIO_COMMIT: 4cb3e3492a1e17a911702e74926bedecd593edea

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Forbidden Vid
        uses: actions/checkout@v4
        with:
          path: fv

      - name: Get NuvioTV source and apply Forbidden Vid changes
        run: |
          git init -q nuvio
          cd nuvio
          git remote add origin https://github.com/NuvioMedia/NuvioTV.git
          git fetch -q --depth 1 origin "$NUVIO_COMMIT"
          git checkout -q FETCH_HEAD
          git apply --binary --whitespace=nowarn ../fv/patches/forbiddenvid.patch
          echo "Patch applied: $(git status --short | wc -l) files changed"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local.properties (Nuvio account server + optional TMDB key)
        env:
          GH_TOKEN: ${{ github.token }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/nuvio-apk"
          gh release download --repo NuvioMedia/NuvioTV --pattern '*arm64-v8a*.apk' --dir "$RUNNER_TEMP/nuvio-apk" \
            || gh release download --repo NuvioMedia/NuvioTV --pattern '*.apk' --dir "$RUNNER_TEMP/nuvio-apk"
          APK=$(ls "$RUNNER_TEMP"/nuvio-apk/*.apk | head -1)
          python3 fv/scripts/nuvio_backend_props.py "$APK" > nuvio/local.properties
          # TMDB key for kids ratings: your own secret if set, otherwise the one inside Nuvio's app.
          if [ -z "$TMDB_API_KEY" ]; then
            for k in $(python3 fv/scripts/nuvio_tmdb_candidates.py "$APK"); do
              echo "::add-mask::$k"
              code=$(curl -s -o /dev/null -w "%{http_code}" "https://api.themoviedb.org/3/configuration?api_key=$k")
              if [ "$code" = "200" ]; then TMDB_API_KEY="$k"; break; fi
            done
          fi
          if [ -n "$TMDB_API_KEY" ]; then
            echo "TMDB key found - kids ratings enabled"
          else
            echo "::warning::No working TMDB key found - kids profiles will be empty."
          fi
          echo "TMDB_API_KEY=${TMDB_API_KEY}" >> nuvio/local.properties

          # Trakt sign-in: the client id/secret inside Nuvio's app, tested against Trakt.
          UA="ForbiddenVid-build/1.0"
          CANDS=$(python3 fv/scripts/nuvio_hex_candidates.py "$APK" 64)
          for c in $CANDS; do echo "::add-mask::$c"; done
          TRAKT_ID=""; TRAKT_SECRET=""; DEVICE_CODE=""
          for c in $CANDS; do
            code=$(curl -s -o "$RUNNER_TEMP/dc.json" -w "%{http_code}" -X POST "https://api.trakt.tv/oauth/device/code" \
              -H "Content-Type: application/json" -H "User-Agent: $UA" -d "{\"client_id\":\"$c\"}")
            if [ "$code" = "200" ]; then
              TRAKT_ID="$c"
              DEVICE_CODE=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['device_code'])" "$RUNNER_TEMP/dc.json")
              echo "::add-mask::$DEVICE_CODE"
              break
            fi
          done
          if [ -n "$TRAKT_ID" ]; then
            for c in $CANDS; do
              [ "$c" = "$TRAKT_ID" ] && continue
              sleep 6
              code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.trakt.tv/oauth/device/token" \
                -H "Content-Type: application/json" -H "User-Agent: $UA" \
                -d "{\"code\":\"$DEVICE_CODE\",\"client_id\":\"$TRAKT_ID\",\"client_secret\":\"$c\"}")
              # 400 = "waiting for the user" -> this secret belongs to the client id
              if [ "$code" = "400" ]; then TRAKT_SECRET="$c"; break; fi
            done
          fi
          if [ -n "$TRAKT_ID" ] && [ -n "$TRAKT_SECRET" ]; then
            echo "Trakt sign-in enabled"
          else
            echo "::warning::Couldn't find working Trakt credentials - Trakt sign-in won't work."
          fi
          echo "TRAKT_CLIENT_ID=${TRAKT_ID}" >> nuvio/local.properties
          echo "TRAKT_CLIENT_SECRET=${TRAKT_SECRET}" >> nuvio/local.properties
          touch nuvio/local.dev.properties

      - name: Signing key
        # Always the same permanent key (signing/forbiddenvid.jks) so each build installs over the last one.
        run: |
          {
            echo "NUVIO_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/fv/signing/forbiddenvid.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=forbiddenvid"
            echo "NUVIO_RELEASE_KEY_PASSWORD=forbiddenvid-5e7f6ab2a198bca6"
            echo "NUVIO_RELEASE_STORE_PASSWORD=forbiddenvid-5e7f6ab2a198bca6"
          } >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: nuvio
        env:
          FV_BUILD: ${{ github.run_number }}
        run: ./gradlew :app:assembleFullRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir out
          OUT=nuvio/app/build/outputs/apk/full/release
          ls -la "$OUT"
          cp "$OUT"/app-full-arm64-v8a-release.apk out/ForbiddenVid-arm64-v8a.apk
          cp "$OUT"/app-full-armeabi-v7a-release.apk out/ForbiddenVid-armeabi-v7a.apk
          cp "$OUT"/app-full-universal-release.apk out/ForbiddenVid-universal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ForbiddenVid
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: Forbidden Vid 1.2.${{ github.run_number }}
          make_latest: true
          body: |
            ${{ github.event.head_commit.message || 'New Forbidden Vid build' }}

            Most TVs, Fire TV and Google TV: ForbiddenVid-arm64-v8a.apk. Older 32-bit boxes: ForbiddenVid-armeabi-v7a.apk.
          files: out/*.apk
