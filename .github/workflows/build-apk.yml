name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ForbiddenVOD.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ForbiddenVOD-apk
          path: ForbiddenVOD.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Forbidden VOD 1.0 (build ${{ github.run_number }})
          make_latest: true
          body: |
            Android TV / Google TV / Fire TV app. Download **ForbiddenVOD.apk** below and sideload it (see README).
          files: ForbiddenVOD.apk
